name: CI

on:
  push:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.16.9
      - run: ruff check src tests deploy

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: self_healing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_DSN: "host=localhost port=5432 dbname=self_healing user=postgres password=postgres"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Apply schema
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d self_healing -f src/ledger/schema.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -d self_healing -f src/vectorstore/schema.sql
      - name: Cache Hugging Face model downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('requirements.txt') }}
      - name: Run tests (excludes tests marked "live": real external network calls / credentialed APIs)
        run: pytest tests/ -m "not live" --cov=src --cov-report=term-missing

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: self-healing-pipeline:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
